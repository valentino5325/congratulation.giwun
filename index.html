<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#142b45">
  <title>마장대학교 | 합격자 조회</title>
  <style>
    :root { color-scheme: light; --navy:#142b45; --ink:#1c2b3b; --muted:#536273; --line:#dce2e9; --paper:#fff; --red:#9c3038; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f1f4f7; color:var(--ink); font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; line-height:1.65; font-size:16px; }
    [hidden] { display:none !important; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    :focus-visible { outline:3px solid #3171ad; outline-offset:4px; }
    header { background:var(--navy); color:white; border-top:5px solid #b59a60; }
    .header-inner { max-width:1040px; margin:auto; padding:24px 32px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { font-size:1.5rem; font-weight:800; letter-spacing:-.04em; color:inherit; text-decoration:none; }
    .brand:hover { text-decoration:underline; text-underline-offset:5px; }
    .header-label { font-size:.875rem; color:#d0dbe6; }
    main { max-width:840px; padding:48px 24px 64px; margin:auto; }
    .eyebrow { font-size:.875rem; color:var(--muted); letter-spacing:.14em; margin:0 0 8px; }
    h1 { font-size:clamp(1.8rem,5vw,2.6rem); letter-spacing:-.055em; line-height:1.3; margin:0 0 12px; }
    .lookup-heading { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; margin-bottom:12px; }
    .lookup-heading h1 { margin:0; }
    .lookup-countdown { display:inline-block; margin:0; padding:6px 12px; border:1px solid var(--line); border-radius:4px; background:white; color:var(--navy); font-size:.9375rem; font-weight:700; font-variant-numeric:tabular-nums; }
    .intro { color:var(--muted); margin:0 0 32px; }
    .card { background:var(--paper); border:1px solid var(--line); border-top:3px solid var(--navy); box-shadow:0 10px 35px #142b4506; }
    .card-heading { padding:20px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:16px; }
    h2 { font-size:1.125rem; margin:0; }
    .required-note { font-size:.875rem; color:var(--muted); }
    form { padding:28px; }
    label { display:block; font-size:.9375rem; font-weight:700; margin-bottom:8px; }
    .required-mark { color:#c62828; margin-left:4px; font-weight:700; }
    .name-field { margin-bottom:28px; }
    input { border:1px solid #aebbc8; border-radius:3px; background:white; padding:12px 14px; width:100%; min-width:0; color:var(--ink); }
    input::placeholder { color:#6a7785; }
    fieldset { margin:0; padding:0; border:0; min-width:0; }
    legend { font-size:.9375rem; font-weight:700; margin-bottom:14px; padding:0; }
    .scores { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .scores label { color:var(--muted); font-weight:400; }
    .input-unit { position:relative; }
    .input-unit input { padding-right:40px; }
    .input-unit span { position:absolute; right:14px; top:13px; color:var(--muted); pointer-events:none; }
    .hint { font-size:.875rem; color:var(--muted); margin:14px 0 24px; }
    .primary,.secondary { width:100%; min-height:52px; border-radius:3px; font-weight:700; padding:12px 18px; }
    .primary { background:var(--navy); color:white; border:1px solid var(--navy); }
    .primary:hover { background:#224567; }
    .secondary { background:white; color:var(--navy); border:1px solid #aebbc8; margin-top:24px; }
    .secondary:hover { background:#f4f6f8; }
    .notice { margin-top:24px; border-left:3px solid #bcc8d5; padding-left:16px; font-size:.875rem; color:var(--muted); }
    .notice p { margin:4px 0; }
    footer { text-align:center; padding:0 20px 30px; color:var(--muted); font-size:.875rem; }
    .result-card { padding:36px 32px; text-align:center; }
    .result-label { font-size:.875rem; color:var(--muted); letter-spacing:.16em; margin:0 0 12px; }
    .result-title { font-family:"Noto Serif KR","Batang",serif; font-size:clamp(2rem,6vw,3rem); line-height:1.45; margin:0 0 20px; letter-spacing:.08em; }
    .applicant { font-size:1.25rem; font-weight:700; margin:16px 0 8px; overflow-wrap:anywhere; }
    .result-description { color:var(--muted); margin:0 0 28px; }
    .score-summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:20px 0; margin:0; gap:12px; }
    .score-summary dt { font-size:.875rem; color:var(--muted); }
    .score-summary dd { margin:6px 0 0; font-size:1.25rem; font-weight:700; }
    .average { display:flex; justify-content:space-between; align-items:baseline; gap:16px; background:#f0f4f8; padding:18px 20px; margin-top:16px; text-align:left; }
    .average strong { font-size:1.6rem; white-space:nowrap; }
    .decision { display:inline-block; font-size:1.125rem; font-weight:800; color:var(--red); border:2px solid var(--red); padding:4px 24px; margin:28px 0 12px; letter-spacing:.12em; }
    .decision.failed { color:var(--muted); border-color:var(--muted); }
    .celebration { margin-top:24px; }
    .result-scores { margin-top:32px; }
    .exam-number { color:var(--muted); overflow-wrap:anywhere; margin:0 0 16px; }
    .message { width:fit-content; max-width:100%; text-align:left; white-space:pre-line; word-break:keep-all; overflow-wrap:anywhere; color:#435367; margin:0 auto; }
    .signature { font-size:.9375rem; font-weight:700; margin:24px 0 0; }
    .photos { display:grid; gap:18px; margin-bottom:24px; }
    .photos figure { margin:0; }
    .photos img { display:block; width:100%; height:auto; object-fit:contain; background:#f1f4f7; }
    .photos figcaption { font-size:.875rem; color:var(--muted); margin-top:8px; }
    .photo-error { color:var(--muted); font-size:.875rem; }
    .confetti { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:5; }
    .confetti i { position:absolute; top:-20px; width:7px; height:13px; animation:fall 3.8s ease-in forwards; }
    @keyframes fall { to { transform:translateY(110vh) rotate(620deg); } }
    @media (prefers-reduced-motion:reduce) { .confetti { display:none; } }
    @media (max-width:560px) {
      .header-inner { padding:19px 20px; } .brand { font-size:1.25rem; }
      main { padding:32px 16px 40px; } .card-heading { padding:18px 20px; }
      form,.result-card { padding:24px 20px; } .scores { grid-template-columns:1fr; gap:18px; }
      .score-summary { gap:6px; } .score-summary dt { font-size:.875rem; } .score-summary dd { font-size:1.125rem; }
      .header-label { max-width:7em; text-align:right; } .average { padding:16px; }
    }
  </style>
</head>
<body>
  <header><div class="header-inner"><a class="brand" data-university href="./" aria-label="마장대학교 합격자 조회 처음으로">마장대학교</a><div class="header-label">입학처 · 합격자 조회</div></div></header>
  <main>
    <section id="lookup" aria-labelledby="lookup-title">
      <p class="eyebrow">ADMISSIONS</p>
      <div class="lookup-heading"><h1 id="lookup-title">최종 합격자 조회</h1><p id="lookup-countdown" class="lookup-countdown" role="timer" aria-live="off"></p></div>
      <p class="intro">지원자 이름, 수험번호와 전형별 점수를 입력해 주세요.</p>
      <div class="card">
        <div class="card-heading"><h2>지원자 정보</h2><span class="required-note">모든 항목 필수</span></div>
        <form id="lookup-form" novalidate>
          <div class="name-field"><label for="applicant-name">이름<span class="required-mark" aria-hidden="true">*</span></label><input id="applicant-name" name="name" type="text" placeholder="이름을 입력해 주세요" autocomplete="off" maxlength="40" required></div>
          <div class="name-field"><label for="applicant-number">수험번호<span class="required-mark" aria-hidden="true">*</span></label><input id="applicant-number" name="applicantNumber" type="text" placeholder="수험번호를 입력해 주세요" autocomplete="off" maxlength="40" required></div>
          <fieldset style="margin-bottom:24px"><legend>전형별 시험 점수</legend><div class="scores">
            <div><label for="practical">1차(실기)<span class="required-mark" aria-hidden="true">*</span></label><div class="input-unit"><input id="practical" name="practical" type="number" inputmode="decimal" min="0" max="50" step="0.01" placeholder="점수 입력" required><span aria-hidden="true">점</span></div></div>
            <div><label for="interview">2차(면접)<span class="required-mark" aria-hidden="true">*</span></label><div class="input-unit"><input id="interview" name="interview" type="number" inputmode="decimal" min="0" max="50" step="0.01" placeholder="점수 입력" required><span aria-hidden="true">점</span></div></div>
          </div></fieldset>
          <button class="primary" type="submit">합격 여부 확인</button>
        </form>
      </div>
      <div class="notice"><p>점수는 소수점 둘째 자리까지 입력할 수 있습니다.</p><p>입력한 이름, 수험번호와 점수는 서버에 저장되지 않습니다.</p></div>
      <noscript><p>합격 여부를 확인하려면 브라우저에서 JavaScript를 활성화해 주세요.</p></noscript>
    </section>
    <section id="result" hidden aria-labelledby="result-title">
      <div class="card result-card">
        <p class="result-label">ADMISSION RESULT</p>
        <h1 class="result-title" id="result-title" tabindex="-1">합격자 조회 결과</h1>
        <p class="applicant" id="result-name"></p>
        <div class="celebration" id="celebration" hidden>
          <div class="photos" id="photos" hidden></div>
          <p class="message" id="birthday-message"></p>
          <p class="signature" id="signature"></p>
        </div>
        <section class="result-scores" aria-label="전형별 성적">
          <p class="decision" id="decision"></p>
          <p class="exam-number" id="result-number"></p>
          <dl class="score-summary"><div><dt>1차(실기)</dt><dd id="practical-result"></dd></div><div><dt>2차(면접)</dt><dd id="interview-result"></dd></div></dl>
          <div class="average"><span>총점</span><strong id="total-result"></strong></div>
        </section>
        <button type="button" class="secondary" id="back-button">다시 조회하기</button>
      </div>
    </section>
    <section id="lookup-notice" hidden aria-labelledby="notice-title">
      <div class="card result-card">
        <p class="result-label">ADMISSIONS</p>
        <h1 id="notice-title" class="result-title" tabindex="-1"></h1>
        <p id="notice-message" class="result-description" aria-live="polite"></p>
        <p id="countdown" class="applicant" role="timer" aria-live="off" hidden></p>
        <button id="notice-back" type="button" class="secondary">합격자 조회로 돌아가기</button>
      </div>
    </section>
  </main>
  <footer><span data-university>마장대학교</span> 입학처</footer>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <script>
    'use strict';
    // 실제 이름, 대학교 이름, 축하 문구와 사진은 이 설정에서 변경합니다.
    // 사진 예시: { src: './photos/together.jpg', alt: '함께 찍은 사진', caption: '' }
    const SITE_CONFIG = {
      university: '마장대학교',
      opensAt: '2026-10-02T19:30:00+09:00',
      applicant: { name: '김기운', number: '23-0001' },
      previewKey: { name: '김동호', number: '0000' },
      birthdayMessage: '김기운 학생 최종합격을 축하드립니다.\n기를쓰고 실기 전형에 임했겠죠?\n운이 좋으셨네요. 합격입니다ㅋ 근데 졸업 불가임ㅋㅋㅋ',
      signature: '시그마 일동',
      photos: [
        { src: './photos/admission-welcome.webp', alt: '김기운 님의 합격 축하 이미지', width: 2048, height: 1411 },
        { src: './photos/admission-celebration.webp', alt: '다섯 명이 함께한 마장대학교 합격 축하 사진', width: 1920, height: 1080 },
        { src: './photos/final-admission-certificate-v2.webp', alt: '김기운 님의 새로운 마장대학교 합격증서', width: 1080, height: 1350 }
      ]
    };
    const $ = (id) => document.getElementById(id);
    const scoreIds = ['practical', 'interview'];
    let confettiTimer;
    function evaluateScores(values) {
      if (values.length !== 2 || values.some(value => typeof value !== 'number' || !Number.isFinite(value) || value < 0 || value > 50)) {
        throw new RangeError('입력한 시험 점수를 확인해 주세요.');
      }
      // 0.01점 단위의 정수로 판정해 표시 반올림이 합격 여부에 영향을 주지 않게 합니다.
      const totalHundredths = values.reduce((sum, value) => sum + Math.round(value * 100), 0);
      return { total: totalHundredths / 100, passed: totalHundredths >= 8000 };
    }
    function clearConfetti() { clearTimeout(confettiTimer); $('confetti').replaceChildren(); }
    function celebrate() {
      clearConfetti();
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const colors = ['#b59a60', '#9c3038', '#31608c', '#d8b553'];
      for (let i = 0; i < 45; i++) {
        const piece = document.createElement('i');
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * 0.7}s`;
        $('confetti').append(piece);
      }
      confettiTimer = setTimeout(clearConfetti, 4600);
    }
    function renderPhotos() {
      $('photos').replaceChildren();
      $('photos').hidden = SITE_CONFIG.photos.length === 0;
      SITE_CONFIG.photos.forEach(photo => {
        const figure = document.createElement('figure');
        const img = document.createElement('img');
        img.alt = photo.alt || '함께 찍은 사진';
        img.decoding = 'async';
        img.width = photo.width;
        img.height = photo.height;
        img.addEventListener('error', () => {
          const message = document.createElement('p');
          message.className = 'photo-error';
          message.textContent = '사진을 불러오지 못했어요. 잠시 후 다시 조회해 주세요.';
          figure.replaceChildren(message);
        }, { once: true });
        img.src = photo.src;
        const link = document.createElement('a');
        link.href = photo.src;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.setAttribute('aria-label', photo.alt + ' — 원본 크게 보기 (새 창)');
        link.append(img);
        figure.append(link);
        if (photo.caption) {
          const caption = document.createElement('figcaption');
          caption.textContent = photo.caption;
          figure.append(caption);
        }
        $('photos').append(figure);
      });
    }
    document.querySelectorAll('[data-university]').forEach(el => { el.textContent = SITE_CONFIG.university; });
    document.title = `${SITE_CONFIG.university} | 합격자 조회`;
    ['applicant-name', 'applicant-number'].forEach(id => {
      $(id).addEventListener('input', () => $(id).setCustomValidity(''));
    });
    const OPEN_TIME = Date.parse(SITE_CONFIG.opensAt);
    let countdownTimer;
    function lookupStatus(name, number, now = Date.now()) {
      if (name === SITE_CONFIG.previewKey.name && number === SITE_CONFIG.previewKey.number) return 'preview';
      if (now < OPEN_TIME) return 'closed';
      return name === SITE_CONFIG.applicant.name && number === SITE_CONFIG.applicant.number ? 'found' : 'not-found';
    }
    let lookupCountdownTimer;
    function updateLookupCountdown() {
      const seconds = Math.max(0, Math.ceil((OPEN_TIME - Date.now()) / 1000));
      if (seconds === 0) {
        $('lookup-countdown').textContent = '조회 가능';
        clearInterval(lookupCountdownTimer);
        return;
      }
      const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor(seconds % 3600 / 60)).padStart(2, '0');
      const rest = String(seconds % 60).padStart(2, '0');
      $('lookup-countdown').textContent = `조회 시작까지 ${hours}:${minutes}:${rest}`;
    }
    updateLookupCountdown();
    if (Date.now() < OPEN_TIME) lookupCountdownTimer = setInterval(updateLookupCountdown, 1000);
    function switchView(id) {
      ['lookup', 'result', 'lookup-notice'].forEach(view => { $(view).hidden = view !== id; });
      window.scrollTo({ top:0, behavior:'instant' });
    }
    function updateCountdown() {
      const seconds = Math.max(0, Math.ceil((OPEN_TIME - Date.now()) / 1000));
      if (seconds === 0) {
        clearInterval(countdownTimer);
        $('countdown').hidden = true;
        $('notice-title').textContent = '조회가 시작되었습니다';
        $('notice-message').textContent = '합격자 조회 화면으로 돌아가 다시 조회해 주세요.';
        return;
      }
      const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor(seconds % 3600 / 60)).padStart(2, '0');
      const rest = String(seconds % 60).padStart(2, '0');
      $('countdown').textContent = `조회 시작까지 ${hours}:${minutes}:${rest}`;
    }
    function showNotice(kind) {
      clearInterval(countdownTimer);
      clearConfetti();
      $('photos').replaceChildren();
      $('celebration').hidden = true;
      $('countdown').hidden = kind !== 'closed';
      if (kind === 'closed') {
        $('notice-title').textContent = '아직 조회기간이 아닙니다';
        $('notice-message').textContent = '2026년 10월 2일 오후 7시 30분(한국시간)부터 조회할 수 있습니다.';
        updateCountdown();
        countdownTimer = setInterval(updateCountdown, 1000);
      } else {
        $('notice-title').textContent = '해당 학생이 없습니다';
        $('notice-message').textContent = '입력한 이름과 수험번호가 일치하는 학생이 없습니다. 입력 내용을 확인해 주세요.';
      }
      switchView('lookup-notice');
      $('notice-title').focus({ preventScroll:true });
    }
    $('lookup-form').addEventListener('submit', event => {
      event.preventDefault();
      const name = $('applicant-name').value.trim();
      const applicantNumber = $('applicant-number').value.trim();
      const status = lookupStatus(name, applicantNumber);
      if (status === 'closed') { showNotice('closed'); return; }
      $('applicant-name').setCustomValidity(name ? '' : '이름을 입력해 주세요.');
      $('applicant-number').setCustomValidity(applicantNumber ? '' : '수험번호를 입력해 주세요.');
      if (!$('applicant-name').reportValidity() || !$('applicant-number').reportValidity()) return;
      if (status === 'not-found') { showNotice('not-found'); return; }
      const isPreview = status === 'preview';
      if (!isPreview && !$('lookup-form').reportValidity()) return;
      clearInterval(countdownTimer);
      const values = isPreview ? [50, 50] : scoreIds.map(id => $(id).valueAsNumber);
      const displayName = isPreview ? SITE_CONFIG.applicant.name : name;
      const displayNumber = isPreview ? SITE_CONFIG.applicant.number : applicantNumber;
      const { total, passed } = evaluateScores(values);
      $('result-name').textContent = passed
        ? `${displayName} 님 최종 합격을 진심으로 축하합니다.`
        : `${displayName} 님, 아쉽게도 이번 전형에 합격하지 못했습니다.`;
      $('result-number').textContent = `수험번호 ${displayNumber}`;
      scoreIds.forEach((id, i) => { $(`${id}-result`).textContent = `${values[i]}점`; });
      $('total-result').textContent = `${total.toFixed(2)}점`;
      $('decision').textContent = passed ? '최종 합격' : '불합격';
      $('decision').classList.toggle('failed', !passed);
      $('celebration').hidden = !passed;
      $('birthday-message').textContent = '';
      $('signature').textContent = '';
      $('photos').replaceChildren();
      if (passed) {
        $('birthday-message').textContent = SITE_CONFIG.birthdayMessage;
        $('signature').textContent = SITE_CONFIG.signature;
        renderPhotos();
        celebrate();
      } else { clearConfetti(); }
      switchView('result');
      $('result-title').focus({ preventScroll:true });
    });
    function returnToLookup() {
      clearInterval(countdownTimer);
      clearConfetti();
      switchView('lookup');
      $('applicant-name').focus({ preventScroll:true });
    }
    $('back-button').addEventListener('click', returnToLookup);
    $('notice-back').addEventListener('click', returnToLookup);
  </script>
</body>
</html>
